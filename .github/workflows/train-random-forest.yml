name: Train and promote forecast model

on:
  schedule:
    # Daily at 00:07 Bogotá (05:07 UTC); drift alerts can also retrain from the hourly job.
    - cron: "7 5 * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt
      - name: Sync latest released observations
        run: python analysis/pulso_pipeline.py sync
      - name: Train ensemble, validate against weekly naive and RF, save joblib and promote only if it wins
        run: python analysis/pulso_pipeline.py train
