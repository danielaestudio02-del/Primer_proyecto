name: Pulso TransMi — sync and forecast

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt
      - name: Sync stream and submit only when a cycle is open
        run: python analysis/pulso_pipeline.py forecast --send
