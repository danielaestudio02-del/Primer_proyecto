name: Pulso TransMi — sync and forecast

# GitHub's scheduler delays "*/10" runs by up to several hours, and every cycle that
# closes without a submission scores zero. So each run polls the API every 2 minutes
# for ~5.5 h and then dispatches itself again; the schedule is only a backup.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-forecast-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt
      - name: Poll every 2 minutes; sync and submit whenever a cycle is open
        run: |
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            echo "::group::$(date -u +%H:%M:%S) UTC"
            scripts/retry_transient.sh python analysis/pulso_pipeline.py forecast --send || echo "Iteración fallida; se reintenta en 2 min."
            echo "::endgroup::"
            sleep 120
          done
      - name: Dispatch the next polling run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pulso-hourly.yml/dispatches" \
            -d '{"ref":"main"}'
